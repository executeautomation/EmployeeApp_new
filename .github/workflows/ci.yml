
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

      - name: Install pm2
        run: npm install -g pm2

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend

      - name: Start backend
        run: pm2 start npm --name "backend" -- start
        working-directory: ./backend

      - name: Start frontend
        run: pm2 start npm --name "frontend" -- run dev -- --host 127.0.0.1 --port 5173
        working-directory: ./frontend

      - name: Wait for frontend to be ready
        run: npx wait-on http://127.0.0.1:5173

      - name: Run Testsprite Action
        uses: TestSprite/run-action@v1
        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base_url: http://127.0.0.1:5173
          blocking: 'true'
